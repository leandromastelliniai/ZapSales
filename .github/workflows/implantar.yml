name: implantar

# Implantação contínua da produção (issue #24): merge na `main` vai sozinho
# para a VPS, com validação rigorosa e volta automática.
#
# Quem decide QUANDO é este workflow; quem decide SE é a VPS. Cada metade
# confere por conta própria e nenhuma confia na outra:
#
#   portao     só o TOPO da main, com ci, e2e, perf e a publicação das imagens
#              verdes NAQUELE commit, por push — perguntado à API de execuções
#              (scripts/implantacao/portao.sh). Não depende da proteção da
#              branch, que este repositório não tem. Dispara a cada um dos
#              quatro que termina; os primeiros recebem "esperar", o último
#              implanta.
#   implantar  `ssh zapsales-deploy@vps "implantar <sha>"`. A chave só alcança
#              esse comando (kit/implantar.sh acesso), o host é conferido por
#              chave fixa, e a VPS recusa — antes de tocar em qualquer coisa —
#              commit fora da main, rebaixamento e imagem cuja revisão não bate.
#              Depois de instalar ela prova (saúde com a versão nova, nenhuma
#              dependência pior, 2 min sem reinício) e, se algo falha, VOLTA
#              sozinha para a versão anterior. O banco é aditivo e não volta.
#
# Falha abre uma issue (rótulo `implantacao-falhou`); a implantação seguinte
# que passa a fecha. Runbook: docs/runbooks/deploy.md §5.
#
# Interruptor de emergência, sem PR: a variável do repositório
# DEPLOY_AUTOMATICO (Settings › Secrets and variables › Actions › Variables).
# Só `ligado` implanta. Desligado por padrão — num fork, ou antes de a VPS ser
# preparada, o workflow não faz nada.
#
# Segredos: DEPLOY_SSH_KEY (privada), DEPLOY_SSH_KNOWN_HOSTS (a linha que
# `kit/implantar.sh acesso` imprime), DEPLOY_SSH_HOST.

on:
  workflow_run:
    workflows: [ci, e2e, perf, "Publicar imagem Docker (GHCR)"]
    types: [completed]
    branches: [main]
  # Reimplantar o topo da main à mão (o mesmo portão vale).
  workflow_dispatch: {}

# Uma implantação por vez, e nenhuma cancelada no meio: cancelar o job não
# para o que a VPS está fazendo, só deixa o GitHub sem saber como terminou.
concurrency:
  group: implantar-producao
  cancel-in-progress: false

jobs:
  portao:
    # `head_repository` igual ao repositório: um PR de fork cuja branch se chama
    # `main` passa pelo filtro `branches` do workflow_run, e não passa daqui.
    if: vars.DEPLOY_AUTOMATICO == 'ligado' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      decisao: ${{ steps.portao.outputs.decisao }}
      sha: ${{ steps.portao.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/implantacao

      - name: O topo da main está verde?
        id: portao
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Vazio no workflow_dispatch: o candidato passa a ser o topo da main.
          CANDIDATO: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/implantacao/portao.sh


  implantar:
    needs: [portao]
    if: needs.portao.outputs.decisao == 'implantar'
    runs-on: ubuntu-latest
    # Kit (dump + baseline + subida) e 2 min de observação cabem com folga;
    # a VPS termina sozinha mesmo que o job seja interrompido.
    timeout-minutes: 60
    # Só leitura: o token deste job vai para a VPS, que o usa para perguntar ao
    # GitHub e puxar a imagem, e ele expira com o job. Escrever issue é do job
    # `avisar`, cujo token não sai do GitHub.
    permissions:
      contents: read
      packages: read
    outputs:
      codigo: ${{ steps.vps.outputs.codigo }}
      cauda: ${{ steps.vps.outputs.cauda }}
    env:
      SHA: ${{ needs.portao.outputs.sha }}
    steps:
      - name: Chave e host fixos
        env:
          CHAVE: ${{ secrets.DEPLOY_SSH_KEY }}
          CONHECIDOS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          set -euo pipefail
          for v in CHAVE CONHECIDOS HOST; do
            [ -n "${!v}" ] || { echo "::error::Segredo ausente para $v (DEPLOY_SSH_KEY, DEPLOY_SSH_KNOWN_HOSTS, DEPLOY_SSH_HOST)."; exit 1; }
          done
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "$CHAVE" > ~/.ssh/implantar)
          printf '%s\n' "$CONHECIDOS" > ~/.ssh/implantar_known_hosts

      - name: Implantar na VPS
        id: vps
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # O token vai pela entrada padrão (nunca pela linha de comando).
          # StrictHostKeyChecking=yes com o known_hosts do segredo: host com
          # outra chave é recusado, nunca aceito na primeira vez.
          printf '%s\n' "$TOKEN" | ssh -T \
            -i ~/.ssh/implantar -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/implantar_known_hosts" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "zapsales-deploy@$HOST" "implantar $SHA" 2>&1 | tee "$RUNNER_TEMP/implantar.log"
          codigo="${PIPESTATUS[1]}"
          {
            echo "codigo=$codigo"
            echo "cauda<<FIM_DA_CAUDA"
            tail -n 40 "$RUNNER_TEMP/implantar.log" | sed 's/\x1b\[[0-9;]*m//g; /^FIM_DA_CAUDA$/d'
            echo "FIM_DA_CAUDA"
          } >> "$GITHUB_OUTPUT"
          exit "$codigo"

  # Abre a issue `implantacao-falhou` quando o portão quebra ou a implantação
  # não passa, e a fecha quando a seguinte passa. Pulado quando nada foi tentado
  # (interruptor desligado, ou o portão disse "esperar"/"nao").
  avisar:
    needs: [portao, implantar]
    if: always() && (needs.portao.result == 'failure' || needs.implantar.result == 'success' || needs.implantar.result == 'failure' || needs.implantar.result == 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ROTULO: implantacao-falhou
      # Se o portão caiu antes de saber o candidato (a API do topo da main
      # falhou), vale o commit que disparou esta execução.
      SHA: ${{ needs.portao.outputs.sha || github.event.workflow_run.head_sha }}
      PORTAO: ${{ needs.portao.result }}
      RESULTADO: ${{ needs.implantar.result }}
      CODIGO: ${{ needs.implantar.outputs.codigo }}
      CAUDA: ${{ needs.implantar.outputs.cauda }}
      EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Fechar a issue de falha
        if: needs.implantar.result == 'success'
        run: |
          set -euo pipefail
          for numero in $(gh issue list --repo "$REPO" --label "$ROTULO" --state open --json number --jq '.[].number'); do
            gh issue close "$numero" --repo "$REPO" --comment "Resolvida: \`$SHA\` foi implantado e passou nas provas ($EXECUCAO)."
          done

      - name: Abrir (ou atualizar) a issue de falha
        if: needs.implantar.result != 'success'
        run: |
          set -euo pipefail
          if [ "$PORTAO" = "failure" ]; then
            o_que="não chegou a ser tentada: o portão do workflow falhou (a API do GitHub, ou o próprio script)"
          else
            case "${CODIGO:-}" in
              2) o_que="foi **recusada** pela VPS — nada foi alterado na instalação" ;;
              3) o_que="**falhou e voltou sozinha** para a versão anterior (o banco, aditivo, ficou)" ;;
              4) o_que="**falhou e a volta também falhou** — a produção precisa de alguém agora" ;;
              *) o_que="não chegou ao fim pelo GitHub (resultado ${RESULTADO}, código ${CODIGO:-nenhum}: conexão, chave, host ou tempo). A VPS termina — e volta, se for o caso — sozinha: confira o registro dela" ;;
            esac
          fi
          {
            printf 'A implantação de `%s` na produção %s.\n\n' "${SHA:-?}" "$o_que"
            printf 'Execução: %s\n\n' "$EXECUCAO"
            printf 'O registro completo do kit fica só na VPS (`/var/log/zapsales/implantar-*`).\n\n'
            if [ -n "${CAUDA:-}" ]; then printf 'Últimas linhas daqui:\n\n```\n%s\n```\n\n' "$CAUDA"; fi
            printf 'Esta issue fecha sozinha na próxima implantação que passar.\n'
          } > "$RUNNER_TEMP/corpo.md"
          gh label create "$ROTULO" --repo "$REPO" --color B60205 \
            --description "A implantação contínua da produção falhou (implantar.yml)" 2>/dev/null || true
          numero="$(gh issue list --repo "$REPO" --label "$ROTULO" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$numero" ]; then
            gh issue comment "$numero" --repo "$REPO" --body-file "$RUNNER_TEMP/corpo.md"
          else
            gh issue create --repo "$REPO" --label "$ROTULO" \
              --title "Implantação na produção falhou" --body-file "$RUNNER_TEMP/corpo.md"
          fi
