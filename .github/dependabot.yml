version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Espera 7 dias antes de propor uma versão (issue #41). Pacote comprometido
    # no npm e ação comprometida no GitHub costumam ser descobertos e retirados
    # em poucos dias; sem o prazo, o PR chega no dia da publicação e entra com o
    # CI verde, e as imagens desta `main` são as que toda VPS de cliente puxa.
    # Os ALERTAS DE SEGURANÇA não esperam: o prazo só vale para atualização de
    # versão. Uma regra só, nas duas entradas — cerca em
    # tests/unit/dependabot-tem-cooldown.test.ts.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # `@types/node` acompanha o RUNTIME, não o "latest" do npm. O runtime é
      # Node 22 em toda parte — `engines`, `.nvmrc`, os três Dockerfiles e os
      # workflows —, e tipagem de um major acima descreve API que não existe em
      # produção: o `tsc` aprova, o contêiner do cliente quebra em runtime.
      # Minor e patch dentro do 22 continuam entrando pelo grupo acima.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # As ações entram fixadas pelo hash do commit com `# vN.M.P` ao lado (issue
  # #39, cerca em tests/unit/acoes-fixadas-por-hash.test.ts): o Dependabot lê o
  # comentário e propõe hash e versão novos juntos. `directory: "/"` só alcança
  # .github/workflows/ — sem a segunda entrada, a ação composta de
  # .github/actions/ ficaria congelada no hash de hoje.
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
    # O mesmo prazo de 7 dias da entrada npm, pelo mesmo motivo (issue #41).
    cooldown:
      default-days: 7
