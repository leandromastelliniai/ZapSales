<!doctype html>
<html lang="pt-BR" data-tema="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manual do usuário · ZapSales</title>
<meta name="description" content="Manual completo do ZapSales: cada menu, cada tela e cada botão, com prints e passo a passo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23773df9'/%3E%3Cpath d='M18 5 9 18h6l-1 9 9-13h-6z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --fundo:#f7f5fc; --superficie:#ffffff; --superficie-2:#f0edf8; --borda:#e3dff0; --borda-forte:#cdc7e2;
  --texto:#1c1c26; --texto-2:#4b4b5c; --texto-3:#767689;
  --acento:#773df9; --acento-2:#5f2cd6; --acento-fraco:#f0eaff; --acento-texto:#ffffff;
  --marca:#e11d48;
  --ok:#0f7b4b; --ok-fundo:#e6f6ee; --aviso:#8a5a00; --aviso-fundo:#fff4d9; --perigo:#b42318; --perigo-fundo:#fdeceb; --info:#1d4ed8; --info-fundo:#e8efff;
  --sombra:0 1px 2px rgba(20,20,40,.06),0 6px 20px rgba(20,20,40,.06);
  --raio:12px; --topo:60px; --largura-indice:296px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root[data-tema="auto"]{
  --fundo:#13101f; --superficie:#1b1729; --superficie-2:#241f38; --borda:#2e2849; --borda-forte:#40386a;
  --texto:#ececf3; --texto-2:#b7b7c9; --texto-3:#8d8da3;
  --acento:#9e8aff; --acento-2:#b7a8ff; --acento-fraco:#2a2147; --acento-texto:#14102a;
  --ok:#5fd29b; --ok-fundo:#10291f; --aviso:#f0c04d; --aviso-fundo:#2e2410; --perigo:#ff8a80; --perigo-fundo:#321816; --info:#8fb0ff; --info-fundo:#16203d;
  --sombra:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-tema="escuro"]{
  --fundo:#13101f; --superficie:#1b1729; --superficie-2:#241f38; --borda:#2e2849; --borda-forte:#40386a;
  --texto:#ececf3; --texto-2:#b7b7c9; --texto-3:#8d8da3;
  --acento:#9e8aff; --acento-2:#b7a8ff; --acento-fraco:#2a2147; --acento-texto:#14102a;
  --ok:#5fd29b; --ok-fundo:#10291f; --aviso:#f0c04d; --aviso-fundo:#2e2410; --perigo:#ff8a80; --perigo-fundo:#321816; --info:#8fb0ff; --info-fundo:#16203d;
  --sombra:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark;}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--topo) + 18px)}
body{margin:0;background:var(--fundo);color:var(--texto);font:16px/1.68 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acento);text-underline-offset:3px}
a:hover{color:var(--acento-2)}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit}
kbd{font:600 .82em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--superficie-2);border:1px solid var(--borda-forte);border-bottom-width:2px;border-radius:6px;padding:.05em .45em}
code{font:.88em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--superficie-2);border-radius:6px;padding:.1em .4em}

/* ---------- topo ---------- */
.topo{position:fixed;inset:0 0 auto 0;height:var(--topo);z-index:50;display:flex;align-items:center;gap:14px;padding:0 18px;background:color-mix(in srgb,var(--superficie) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--borda)}
.marca{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--texto);white-space:nowrap}
.marca b{font-size:1.15rem;letter-spacing:-.01em}
.marca span{font-size:.85rem;color:var(--texto-3)}
.btn-icone{display:inline-grid;place-items:center;min-width:40px;height:40px;padding:0 10px;border:1px solid var(--borda);background:var(--superficie);border-radius:10px;cursor:pointer}
.btn-icone:hover{border-color:var(--borda-forte);background:var(--superficie-2)}
#abrir-indice{display:none}
.busca{position:relative;flex:1;max-width:640px;margin:0 auto}
.busca input{width:100%;height:42px;padding:0 84px 0 42px;border:1px solid var(--borda-forte);border-radius:12px;background:var(--superficie);color:var(--texto);font:inherit}
.busca input::placeholder{color:var(--texto-3)}
.busca .lupa{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--texto-3);pointer-events:none}
.busca .atalho{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:.78rem;color:var(--texto-3);pointer-events:none}
#resultados{position:absolute;left:0;right:0;top:calc(100% + 8px);max-height:min(70vh,560px);overflow:auto;background:var(--superficie);border:1px solid var(--borda-forte);border-radius:14px;box-shadow:var(--sombra);padding:6px;display:none}
#resultados.aberto{display:block}
.res{display:block;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--texto)}
.res[aria-selected="true"],.res:hover{background:var(--acento-fraco)}
.res .caminho{font-size:.78rem;color:var(--texto-3)}
.res .titulo{font-weight:650}
.res .trecho{font-size:.88rem;color:var(--texto-2);margin-top:2px}
.res mark,mark.achado{background:#ffe27a;color:#1c1c26;border-radius:3px;padding:0 2px}
.sem-res{padding:16px;color:var(--texto-2)}


/* ---------- identidade: ZapSales by Futuristas ---------- */
.topo{--superficie:#241f3a;--superficie-2:#2e2750;--borda:#3a3360;--borda-forte:#4a4175;--texto:#f3f0ff;--texto-2:#d3ccef;--texto-3:#a79fc9;--acento-fraco:#2e2750;--acento:#b7a8ff;
  background:#1a162a;border-bottom:1px solid #2c2547;backdrop-filter:none;color:var(--texto);box-shadow:0 1px 0 rgba(119,61,249,.35)}
.topo::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,#773df9,#9e8aff 50%,transparent);opacity:.85;pointer-events:none}
.marca{align-items:center;color:#fff}
.marca .simbolo{width:30px;height:30px;align-self:center}
.simbolo{--bl:#9e8aff;--rz:#fff}
.marca b{color:#fff}.marca span{color:#a79fc9}
.por{display:flex;align-items:center;gap:8px;padding-left:14px;margin-left:2px;border-left:1px solid #3a3360;color:#fff}
.por i{font-style:normal;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#a79fc9}
.por svg{height:15px;width:auto;fill:#fff}
.topo,.capa{--sq:#9e8aff}.rodape-marca{--sq:#773df9}
.topo .busca input{background:#241f3a;border-color:#3a3360;color:#f3f0ff}
.topo .busca input::placeholder{color:#a79fc9}
.topo .btn-icone{background:#241f3a;border-color:#3a3360;color:#f3f0ff}
.topo .btn-icone:hover{background:#2e2750;border-color:#5a4fa0}
.topo #resultados{background:#1b1729;border-color:#4a4175}
.capa{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin:6px 0 30px;padding:26px 30px;border-radius:18px;color:#fff;background:radial-gradient(120% 140% at 0% 0%,#3a1f94 0%,#1a162a 55%,#14101f 100%);box-shadow:0 10px 30px rgba(26,22,42,.25)}
.capa .simbolo{width:76px;height:76px;flex:none}
.capa .txt{flex:1;min-width:220px}
.capa .nome{font-size:1.9rem;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.capa .sub{margin-top:6px;color:#cfc6f5;font-size:1.02rem}
.capa .por{border:0;padding:0;margin:14px 0 0}
.capa .por svg{height:20px}
.rodape-marca{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;color:var(--texto)}
.rodape-marca .simbolo{width:26px;height:26px}
.rodape-marca .simbolo{--bl:var(--acento);--rz:var(--texto)}
.rodape-marca svg.fut{height:14px;width:auto;fill:currentColor}
@media (prefers-color-scheme:dark){:root[data-tema="auto"] .rodape-marca{--sq:#9e8aff}}
:root[data-tema="escuro"] .rodape-marca{--sq:#9e8aff}
@media (max-width:1100px){.topo .por{display:none}}
@media print{.capa{box-shadow:none;border:1px solid #cdc7e2;background:#1a162a;-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* ---------- estrutura ---------- */
.corpo{display:grid;grid-template-columns:var(--largura-indice) minmax(0,1fr) 230px;gap:0;padding-top:var(--topo);min-height:100vh}
.indice{position:sticky;top:var(--topo);align-self:start;height:calc(100vh - var(--topo));overflow:auto;padding:18px 14px 40px 18px;border-right:1px solid var(--borda);background:var(--superficie)}
.indice .progresso{font-size:.8rem;color:var(--texto-3);margin:0 6px 14px}
.indice details{margin:0 0 6px}
.indice summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;font-weight:700;font-size:.92rem}
.indice summary::-webkit-details-marker{display:none}
.indice summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--texto-3);border-bottom:2px solid var(--texto-3);transform:rotate(-45deg);transition:transform .15s}
.indice details[open]>summary::before{transform:rotate(45deg)}
.indice summary:hover{background:var(--superficie-2)}
.indice ul{list-style:none;margin:2px 0 8px;padding:0 0 0 14px;border-left:1px solid var(--borda);margin-left:14px}
.indice li a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--texto-2);font-size:.92rem}
.indice li a:hover{background:var(--superficie-2);color:var(--texto)}
.indice li a[aria-current="page"]{background:var(--acento-fraco);color:var(--acento);font-weight:650}
.indice li a.pendente{color:var(--texto-3)}
.indice li a em{font:600 .68rem/1 system-ui;text-transform:uppercase;letter-spacing:.04em;color:var(--texto-3);border:1px solid var(--borda);border-radius:99px;padding:3px 6px;font-style:normal;white-space:nowrap}
main{padding:34px clamp(18px,4vw,56px) 80px;min-width:0}
.pagina{max-width:820px;margin:0 auto}
.pagina[hidden]{display:none}
.nesta-pagina{position:sticky;top:var(--topo);align-self:start;max-height:calc(100vh - var(--topo));overflow:auto;padding:34px 18px 40px 6px;font-size:.86rem}
.nesta-pagina h4{margin:0 0 8px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--texto-3)}
.nesta-pagina a{display:block;padding:4px 0 4px 10px;border-left:2px solid var(--borda);color:var(--texto-2);text-decoration:none}
.nesta-pagina a:hover{color:var(--texto)}
.nesta-pagina a.ativo{border-left-color:var(--acento);color:var(--acento);font-weight:650}

/* ---------- conteúdo ---------- */
.migalha{font-size:.85rem;color:var(--texto-3);margin:0 0 8px}
.migalha a{color:inherit}
.pagina h1{font-size:clamp(1.9rem,3.4vw,2.5rem);line-height:1.15;letter-spacing:-.02em;margin:0 0 10px}
.pagina .lede{font-size:1.12rem;color:var(--texto-2);margin:0 0 22px;max-width:68ch}
.pagina h2{font-size:1.45rem;line-height:1.25;letter-spacing:-.01em;margin:46px 0 12px;padding-top:6px;position:relative}
.pagina h2 .ancora{position:absolute;left:-1.1em;color:var(--texto-3);text-decoration:none;opacity:0;font-weight:400}
.pagina h2 .ancora::before{content:"#"}
.pagina h2:hover .ancora{opacity:1}
.pagina h3{font-size:1.1rem;margin:28px 0 8px}
.pagina p,.pagina li{max-width:72ch}
.pagina ul,.pagina ol{padding-left:1.35em}
.pagina li{margin:.3em 0}
.ficha{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0 0 26px;padding:16px 18px;background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio);font-size:.94rem}
.ficha dt{color:var(--texto-3);font-weight:600}
.ficha dd{margin:0}
.ui{display:inline-block;padding:0 .45em;border:1px solid var(--borda-forte);border-radius:7px;background:var(--superficie);font-weight:600;font-size:.92em;white-space:nowrap}
figure.print{margin:20px 0 26px;padding:0}
figure.print img{display:block;width:100%;height:auto;border:1px solid var(--borda-forte);border-radius:var(--raio);box-shadow:var(--sombra);cursor:zoom-in;background:#fff}
figure.print figcaption{margin-top:8px;font-size:.86rem;color:var(--texto-3)}
figure.print.estreita{max-width:520px}
figure.print.media{max-width:680px}
ol.legenda{list-style:none;counter-reset:leg;padding:0;margin:14px 0 26px;display:grid;gap:8px}
ol.legenda>li{counter-increment:leg;position:relative;padding:10px 14px 10px 52px;background:var(--superficie);border:1px solid var(--borda);border-radius:10px;max-width:none}
ol.legenda>li::before{content:counter(leg);position:absolute;left:12px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--marca);color:#fff;font:700 .9rem/28px system-ui;text-align:center;box-shadow:0 0 0 2px var(--superficie)}
ol.passos{list-style:none;counter-reset:pas;padding:0;margin:14px 0 24px}
ol.passos>li{counter-increment:pas;position:relative;padding:2px 0 14px 46px;margin:0;border-left:2px solid var(--borda);margin-left:15px;padding-left:34px}
ol.passos>li::before{content:counter(pas);position:absolute;left:-16px;top:0;width:30px;height:30px;border-radius:50%;background:var(--acento);color:var(--acento-texto);font:700 .9rem/30px system-ui;text-align:center}
ol.passos>li:last-child{border-left-color:transparent}
.nota{margin:18px 0;padding:14px 16px 14px 48px;border-radius:var(--raio);position:relative;border:1px solid;max-width:none}
.nota::before{position:absolute;left:16px;top:13px;font-size:1.15rem}
.nota p{margin:.35em 0;max-width:none}
.nota strong:first-child{display:block;margin-bottom:2px}
.nota.dica{background:var(--ok-fundo);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}.nota.dica::before{content:"💡"}
.nota.atencao{background:var(--aviso-fundo);border-color:color-mix(in srgb,var(--aviso) 40%,transparent)}.nota.atencao::before{content:"⚠️"}
.nota.perigo{background:var(--perigo-fundo);border-color:color-mix(in srgb,var(--perigo) 40%,transparent)}.nota.perigo::before{content:"⛔"}
.nota.info{background:var(--info-fundo);border-color:color-mix(in srgb,var(--info) 35%,transparent)}.nota.info::before{content:"ℹ️"}
table.tabela{width:100%;border-collapse:collapse;margin:16px 0 24px;font-size:.93rem;background:var(--superficie);border:1px solid var(--borda);border-radius:10px;overflow:hidden}
.tabela th,.tabela td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--borda);vertical-align:top}
.tabela th{background:var(--superficie-2);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--texto-2)}
.tabela tr:last-child td{border-bottom:0}
.selo{display:inline-block;font:700 .72rem/1 system-ui;padding:4px 8px;border-radius:99px;background:var(--superficie-2);color:var(--texto-2);border:1px solid var(--borda);vertical-align:middle}
.selo.ok{background:var(--ok-fundo);color:var(--ok)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:18px 0}
.cards a{display:block;padding:14px 16px;background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio);text-decoration:none;color:var(--texto)}
.cards a:hover{border-color:var(--acento);box-shadow:var(--sombra)}
.cards b{display:block;margin-bottom:2px}.cards span{font-size:.88rem;color:var(--texto-2)}
.pendente-aviso{padding:18px;border:1px dashed var(--borda-forte);border-radius:var(--raio);background:var(--superficie);color:var(--texto-2)}
.rodape{margin:60px auto 0;max-width:820px;padding-top:18px;border-top:1px solid var(--borda);font-size:.84rem;color:var(--texto-3)}
.pag-nav{display:flex;justify-content:space-between;gap:12px;margin:48px 0 0;max-width:820px}
.pag-nav a{flex:1;padding:12px 14px;border:1px solid var(--borda);border-radius:var(--raio);text-decoration:none;background:var(--superficie);color:var(--texto)}
.pag-nav a:hover{border-color:var(--acento)}
.pag-nav small{display:block;color:var(--texto-3)}
.pag-nav a.prox{text-align:right}
#lightbox{position:fixed;inset:0;z-index:100;background:rgba(10,10,20,.86);display:none;overflow:auto;padding:24px;cursor:zoom-out}
#lightbox.aberto{display:block}
#lightbox img{display:block;margin:0 auto;max-width:none;width:min(1600px,100%);height:auto;border-radius:10px;background:#fff}
#lightbox p{color:#d7d7e6;text-align:center;font-size:.9rem;margin:10px 0 0}

/* ---------- telas menores ---------- */
@media (max-width:1180px){.corpo{grid-template-columns:var(--largura-indice) minmax(0,1fr)}.nesta-pagina{display:none}}
@media (max-width:820px){
  .corpo{grid-template-columns:1fr}
  #abrir-indice{display:inline-grid}
  .indice{position:fixed;inset:var(--topo) auto 0 0;width:min(86vw,340px);z-index:40;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--sombra)}
  body.nav-aberta .indice{transform:none}
  .marca span,.busca .atalho,#imprimir{display:none}
  .busca input{padding-right:14px}
  .ficha{grid-template-columns:1fr}
  .pagina h2 .ancora{display:none}
  .ui{white-space:normal}
  /* tabela vira lista de blocos: cada linha mostra o nome da coluna antes do valor */
  .tabela,.tabela tbody,.tabela tr,.tabela td{display:block}
  .tabela thead{display:none}
  .tabela tr{padding:8px 0;border-bottom:1px solid var(--borda)}
  .tabela tr:last-child{border-bottom:0}
  .tabela td{border:0;padding:3px 14px}
  .tabela td[data-rotulo]::before{content:attr(data-rotulo);display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--texto-3)}
  .tabela td:first-child{font-weight:650}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.indice,.indice summary::before{transition:none}}
@media print{
  .topo,.indice,.nesta-pagina,.pag-nav,#lightbox,.busca{display:none!important}
  .corpo{display:block;padding:0}main{padding:0}
  .pagina[hidden]{display:block!important}
  .pagina{max-width:none;page-break-before:always}
  .pagina:first-of-type{page-break-before:auto}
  figure.print img{box-shadow:none;max-height:240mm;width:auto;max-width:100%}
  body{background:#fff;color:#000}
}
</style>
</head>

<header class="topo">
  <button class="btn-icone" id="abrir-indice" type="button" aria-label="Abrir o índice" aria-controls="indice">☰</button>
  <a class="marca" href="#inicio" aria-label="ZapSales, manual do usuário"><svg class="simbolo" viewBox="0 0 216 216" aria-hidden="true"><use href="#lg-simbolo"/></svg><b>ZapSales</b><span>Manual do usuário</span></a>
  <span class="por" aria-hidden="true"><i>by</i><svg viewBox="0 0 654 115"><use href="#lg-futuristas" width="654" height="115"/></svg></span>
  <div class="busca" role="search">
    <svg class="lupa" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Buscar no manual: campanha, funil, WhatsApp…" aria-label="Buscar no manual" aria-controls="resultados" aria-expanded="false">
    <span class="atalho"><kbd>/</kbd></span>
    <div id="resultados" role="listbox" aria-label="Resultados da busca"></div>
  </div>
  <button class="btn-icone" id="tema" type="button" title="Alternar tema (automático, claro, escuro)" aria-label="Alternar tema">◐</button>
  <button class="btn-icone" id="imprimir" type="button" title="Imprimir o manual inteiro ou salvar em PDF" aria-label="Imprimir">⎙</button>
</header>

<div class="corpo">
  <nav class="indice" id="indice" aria-label="Índice do manual">
{{INDICE}}
  </nav>
  <main id="conteudo">
{{PAGINAS}}
    <footer class="rodape">{{RODAPE}}</footer>
  </main>
  <aside class="nesta-pagina" id="toc-local" aria-label="Nesta página"></aside>
</div>

<div id="lightbox" role="dialog" aria-label="Imagem ampliada" aria-modal="true"><img alt=""><p>Clique ou tecle Esc para fechar</p></div>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  /* ---------- tema ---------- */
  var raiz = document.documentElement, ciclo = ['auto', 'claro', 'escuro'];
  function lerTema() { try { return localStorage.getItem('zs-manual-tema') || 'auto'; } catch (e) { return 'auto'; } }
  function aplicarTema(t) { raiz.setAttribute('data-tema', t); $('#tema').title = 'Tema: ' + t + ' (clique para alternar)'; }
  aplicarTema(lerTema());
  $('#tema').addEventListener('click', function () {
    var t = ciclo[(ciclo.indexOf(raiz.getAttribute('data-tema')) + 1) % 3];
    aplicarTema(t); try { localStorage.setItem('zs-manual-tema', t); } catch (e) {}
  });
  $('#imprimir').addEventListener('click', function () { window.print(); });

  /* ---------- normalização para a busca (sem acento, sem maiúscula) ---------- */
  function n1(c) { return c.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function norm(s) { var o = ''; for (var i = 0; i < s.length; i++) o += n1(s[i]); return o; }

  /* ---------- páginas, rotas e índice ---------- */
  var paginas = $$('.pagina');
  var porId = {}; paginas.forEach(function (p) { porId[p.id] = p; });
  var ordem = $$('#indice a[data-pagina]').map(function (a) { return a.getAttribute('data-pagina'); });
  var termoAtivo = '';

  function limparRealce() {
    $$('mark.achado').forEach(function (m) { var p = m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m); p.normalize(); });
  }
  function realcar(raizEl, termos) {
    if (!termos.length) return;
    var w = document.createTreeWalker(raizEl, NodeFilter.SHOW_TEXT, { acceptNode: function (n) {
      return n.parentNode.closest('script,style,mark') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; } });
    var nos = [], n; while ((n = w.nextNode())) nos.push(n);
    nos.forEach(function (no) {
      var orig = no.nodeValue, nz = norm(orig), marcas = [];
      termos.forEach(function (t) { var i = 0; while ((i = nz.indexOf(t, i)) !== -1) { marcas.push([i, i + t.length]); i += t.length; } });
      if (!marcas.length) return;
      marcas.sort(function (a, b) { return a[0] - b[0]; });
      var frag = document.createDocumentFragment(), pos = 0;
      marcas.forEach(function (m) {
        if (m[0] < pos) return;
        frag.appendChild(document.createTextNode(orig.slice(pos, m[0])));
        var mk = document.createElement('mark'); mk.className = 'achado'; mk.textContent = orig.slice(m[0], m[1]); frag.appendChild(mk); pos = m[1];
      });
      frag.appendChild(document.createTextNode(orig.slice(pos)));
      no.parentNode.replaceChild(frag, no);
    });
  }

  function rotear() {
    var id = decodeURIComponent((location.hash || '').slice(1)) || 'inicio';
    var alvo = document.getElementById(id);
    if (!alvo) { id = 'inicio'; alvo = document.getElementById(id); }
    var pagina = alvo.classList.contains('pagina') ? alvo : alvo.closest('.pagina');
    if (!pagina) { pagina = porId.inicio; alvo = pagina; }
    paginas.forEach(function (p) { p.hidden = (p !== pagina); });
    $$('#indice a[data-pagina]').forEach(function (a) {
      var atual = a.getAttribute('data-pagina') === pagina.id;
      if (atual) { a.setAttribute('aria-current', 'page'); var d = a.closest('details'); if (d) d.open = true; } else a.removeAttribute('aria-current');
    });
    document.title = (pagina.getAttribute('data-titulo') || 'Manual') + ' · Manual do ZapSales';
    document.body.classList.remove('nav-aberta');
    limparRealce();
    if (termoAtivo) realcar(pagina, termoAtivo.split(' ').filter(Boolean));
    montarTocLocal(pagina);
    if (alvo !== pagina) alvo.scrollIntoView(); else window.scrollTo(0, 0);
    var atualEl = $('#indice a[aria-current="page"]'); if (atualEl && atualEl.scrollIntoView) { try { atualEl.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
  }

  var observador = null;
  function montarTocLocal(pagina) {
    var box = $('#toc-local'); box.innerHTML = '';
    var hs = $$('h2[id]', pagina); if (hs.length < 2) return;
    var h = document.createElement('h4'); h.textContent = 'Nesta página'; box.appendChild(h);
    hs.forEach(function (el) {
      var a = document.createElement('a'); a.href = '#' + el.id; a.textContent = el.getAttribute('data-curto') || el.textContent.trim(); box.appendChild(a);
    });
    if (observador) observador.disconnect();
    if ('IntersectionObserver' in window) {
      observador = new IntersectionObserver(function (ents) {
        ents.forEach(function (e) { if (e.isIntersecting) { $$('a', box).forEach(function (a) { a.classList.toggle('ativo', a.getAttribute('href') === '#' + e.target.id); }); } });
      }, { rootMargin: '-80px 0px -70% 0px' });
      hs.forEach(function (el) { observador.observe(el); });
    }
  }

  /* nas tabelas, cada célula guarda o nome da sua coluna (usado na tela de celular) */
  $$('table.tabela').forEach(function (t) {
    var nomes = $$('thead th', t).map(function (th) { return th.textContent.trim(); });
    $$('tbody tr', t).forEach(function (tr) {
      $$('td', tr).forEach(function (td, i) { if (i > 0 && nomes[i]) td.setAttribute('data-rotulo', nomes[i]); });
    });
  });

  /* âncora "#" ao lado dos títulos h2 */
  $$('.pagina h2[id]').forEach(function (h) {
    var a = document.createElement('a'); a.className = 'ancora'; a.href = '#' + h.id; a.setAttribute('aria-label', 'Link direto para esta seção'); h.insertBefore(a, h.firstChild);
  });

  /* anterior / próxima */
  paginas.forEach(function (p) {
    var i = ordem.indexOf(p.id); if (i < 0) return;
    var ant = porId[ordem[i - 1]], prox = porId[ordem[i + 1]];
    if (!ant && !prox) return;
    var nav = document.createElement('div'); nav.className = 'pag-nav';
    nav.innerHTML = (ant ? '<a href="#' + ant.id + '"><small>← Anterior</small>' + ant.getAttribute('data-titulo') + '</a>' : '<span style="flex:1"></span>') +
                    (prox ? '<a class="prox" href="#' + prox.id + '"><small>Próxima →</small>' + prox.getAttribute('data-titulo') + '</a>' : '<span style="flex:1"></span>');
    p.appendChild(nav);
  });

  window.addEventListener('hashchange', rotear);

  /* ---------- busca ---------- */
  var indiceBusca = [];
  paginas.forEach(function (p) {
    var titulo = p.getAttribute('data-titulo') || '', grupo = p.getAttribute('data-grupo-titulo') || '';
    var corpo = $('.conteudo-pagina', p) || p;
    var secoes = [{ id: p.id, rotulo: '', texto: '' }], atual = secoes[0];
    Array.prototype.forEach.call(corpo.children, function (el) {
      if (el.tagName === 'H2' && el.id) { atual = { id: el.id, rotulo: el.textContent.trim(), texto: '' }; secoes.push(atual); }
      else if (!el.classList.contains('pag-nav')) atual.texto += ' ' + el.textContent;
    });
    var chave = (p.getAttribute('data-palavras') || '') + ' ' + (p.getAttribute('data-resumo') || '');
    secoes.forEach(function (s, i) {
      var texto = (s.texto + (i === 0 ? ' ' + chave : '')).replace(/\s+/g, ' ').trim();
      indiceBusca.push({ pagina: p.id, id: s.id, titulo: titulo, grupo: grupo, rotulo: s.rotulo, texto: texto,
        nTitulo: norm(titulo + ' ' + s.rotulo), nTexto: norm(texto), pendente: p.classList.contains('stub') });
    });
  });

  var q = $('#q'), box = $('#resultados'), sel = -1, itens = [];
  function escapar(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function trecho(texto, termos) {
    var nz = norm(texto), pos = -1;
    for (var i = 0; i < termos.length; i++) { var p = nz.indexOf(termos[i]); if (p !== -1 && (pos === -1 || p < pos)) pos = p; }
    var ini = Math.max(0, (pos === -1 ? 0 : pos) - 60), fim = Math.min(texto.length, ini + 190);
    var parte = texto.slice(ini, fim), nzp = norm(parte), marcas = [];
    termos.forEach(function (t) { var k = 0; while ((k = nzp.indexOf(t, k)) !== -1) { marcas.push([k, k + t.length]); k += t.length; } });
    marcas.sort(function (a, b) { return a[0] - b[0]; });
    var out = '', cur = 0; marcas.forEach(function (m) { if (m[0] < cur) return; out += escapar(parte.slice(cur, m[0])) + '<mark>' + escapar(parte.slice(m[0], m[1])) + '</mark>'; cur = m[1]; });
    out += escapar(parte.slice(cur));
    return (ini > 0 ? '… ' : '') + out + (fim < texto.length ? ' …' : '');
  }
  function buscar(txt) {
    var termos = norm(txt).split(/\s+/).filter(function (t) { return t.length > 0; });
    termoAtivo = termos.join(' ');
    if (!termos.length) return fechar();
    var rs = [];
    indiceBusca.forEach(function (s) {
      var pontos = 0;
      for (var i = 0; i < termos.length; i++) {
        var t = termos[i], noT = s.nTitulo.indexOf(t) !== -1, noX = s.nTexto.indexOf(t) !== -1;
        if (!noT && !noX) return;
        pontos += (noT ? 12 : 0) + (noX ? Math.min(8, s.nTexto.split(t).length - 1) : 0);
      }
      if (s.pendente) pontos -= 6;
      rs.push({ s: s, pontos: pontos });
    });
    rs.sort(function (a, b) { return b.pontos - a.pontos; });
    rs = rs.slice(0, 30); itens = rs; sel = rs.length ? 0 : -1;
    if (!rs.length) box.innerHTML = '<div class="sem-res">Nada encontrado para <b>' + escapar(txt) + '</b>. Tente outra palavra, ou menos palavras.</div>';
    else box.innerHTML = rs.map(function (r, i) {
      var s = r.s, href = '#' + s.id;
      return '<a class="res" role="option" id="res-' + i + '" aria-selected="' + (i === 0) + '" href="' + href + '"><div class="caminho">' + escapar(s.grupo) + ' › ' + escapar(s.titulo) + (s.rotulo ? ' › ' + escapar(s.rotulo) : '') + '</div>' +
        '<div class="titulo">' + escapar(s.rotulo || s.titulo) + '</div><div class="trecho">' + trecho(s.texto || s.titulo, termos) + '</div></a>';
    }).join('');
    box.classList.add('aberto'); q.setAttribute('aria-expanded', 'true');
  }
  function fechar() { box.classList.remove('aberto'); q.setAttribute('aria-expanded', 'false'); sel = -1; }
  function marcarSel(i) {
    var els = $$('.res', box); if (!els.length) return; sel = (i + els.length) % els.length;
    els.forEach(function (e, k) { e.setAttribute('aria-selected', k === sel); }); els[sel].scrollIntoView({ block: 'nearest' });
  }
  var t0; q.addEventListener('input', function () { clearTimeout(t0); t0 = setTimeout(function () { buscar(q.value); }, 70); });
  q.addEventListener('focus', function () { if (q.value) buscar(q.value); });
  q.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); marcarSel(sel + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); marcarSel(sel - 1); }
    else if (e.key === 'Enter') { var el = $$('.res', box)[sel]; if (el) { e.preventDefault(); el.click(); } }
    else if (e.key === 'Escape') { if (q.value) { q.value = ''; termoAtivo = ''; limparRealce(); } fechar(); q.blur(); }
  });
  box.addEventListener('click', function (e) {
    var a = e.target.closest('a.res'); if (!a) return;
    var destino = a.getAttribute('href').slice(1); fechar();
    if (decodeURIComponent(location.hash.slice(1)) === destino) rotear();
  });
  document.addEventListener('click', function (e) { if (!e.target.closest('.busca')) fechar(); });
  document.addEventListener('keydown', function (e) {
    var digitando = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || '')) || e.target.isContentEditable;
    if ((e.key === '/' && !digitando) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) { e.preventDefault(); q.focus(); q.select(); }
    if (e.key === 'Escape') { $('#lightbox').classList.remove('aberto'); document.body.classList.remove('nav-aberta'); }
  });

  /* ---------- ampliar prints ---------- */
  var lb = $('#lightbox'), lbImg = $('img', lb);
  document.addEventListener('click', function (e) {
    var im = e.target.closest('figure.print img'); if (!im) return;
    lbImg.src = im.src; lbImg.alt = im.alt; lb.classList.add('aberto');
  });
  lb.addEventListener('click', function () { lb.classList.remove('aberto'); });

  /* menu no celular */
  $('#abrir-indice').addEventListener('click', function () { document.body.classList.toggle('nav-aberta'); });

  rotear();
})();
</script>
</body>
</html>
